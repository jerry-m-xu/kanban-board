# Dev override: mount local backend code and auto-reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--app-dir",
        "backend",
        "--port",
        "3000",
        "--reload",
      ]
    volumes:
      - ./backend:/app/backend
      - sqlite_data:/app/data
    # Avoid restart loop while iterating
    restart: "no"
