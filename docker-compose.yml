services:
  # Production: docker compose --profile app up --build
  # Open http://localhost:3000 (frontend nginx proxies /api to backend)
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      SQLITE_PATH: /app/data/items.db
      UPLOAD_DIR: /app/data/uploads
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-kanban-secret}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      target: production
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Dev: docker compose --profile app-dev up --build
  # UI http://localhost:5173  API http://localhost:3000
  backend-dev:
    profiles: ["app-dev"]
    build: ./backend
    environment:
      SQLITE_PATH: /app/data/items.db
      UPLOAD_DIR: /app/data/uploads
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-kanban-secret}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "3000",
        "--reload",
      ]
    restart: "no"

  frontend-dev:
    profiles: ["app-dev", "app-dev-debug"]
    build:
      context: ./frontend
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Reach whichever backend published :3000 on the host
      VITE_API_PROXY: http://host.docker.internal:3000
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: "no"

  # Dev + debug: docker compose --profile app-dev-debug up --build
  # then Attach to Docker on :5678
  backend-dev-debug:
    profiles: ["app-dev-debug"]
    build: ./backend
    environment:
      SQLITE_PATH: /app/data/items.db
      UPLOAD_DIR: /app/data/uploads
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-kanban-secret}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "3000:3000"
      - "5678:5678"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    command:
      [
        "python",
        "-m",
        "debugpy",
        "--listen",
        "0.0.0.0:5678",
        "-m",
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "3000",
        "--reload",
      ]
    restart: "no"

volumes:
  sqlite_data:
  frontend_node_modules:
