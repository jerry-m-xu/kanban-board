# Debug: mount backend, expose debugpy, wait for Cursor to attach.
# Usage:
#   1. docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build
#   2. In Cursor: Run and Debug → "Attach to Docker" → F5
#   3. Set breakpoints in backend/, then hit the API
services:
  app:
    ports:
      - "3000:3000"
      - "5678:5678"
    environment:
      SQLITE_PATH: /app/data/items.db
    volumes:
      - ./backend:/app/backend
      - sqlite_data:/app/data
    # --reload fights with the debugger; omit it while debugging
    command:
      [
        "python",
        "-m",
        "debugpy",
        "--listen",
        "0.0.0.0:5678",
        "--wait-for-client",
        "-m",
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--app-dir",
        "backend",
        "--port",
        "3000",
      ]
    restart: "no"
